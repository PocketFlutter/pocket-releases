name: Pocket Package Registry Release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact PocketFlutter/Pocket commit on main
        required: true
        type: string
      deploy_pages:
        description: Deploy the signed package registry to GitHub Pages
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pocket-package-registry-pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-registry:
    name: Build and Sign Package Registry
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: pocket-source-ci
    steps:
      - name: Validate inputs and signing key configuration
        id: inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_KEY_AVAILABLE: ${{ secrets.POCKET_SOURCE_SSH_KEY != '' }}
          REGISTRY_KEY_AVAILABLE: ${{ secrets.POCKET_REGISTRY_SIGNING_KEY != '' }}
        run: |
          [[ "$SOURCE_KEY_AVAILABLE" == true ]] || { echo "::error::Missing POCKET_SOURCE_SSH_KEY"; exit 1; }
          [[ "$REGISTRY_KEY_AVAILABLE" == true ]] || { echo "::error::Missing POCKET_REGISTRY_SIGNING_KEY"; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] ||
            { echo "::error::Expected a full 40-character source SHA"; exit 1; }
          printf 'sha=%s\n' "${SOURCE_SHA,,}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: PocketFlutter/Pocket
          ref: ${{ steps.inputs.outputs.sha }}
          path: pocket-source
          ssh-key: ${{ secrets.POCKET_SOURCE_SSH_KEY }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify ancestry on PocketFlutter/Pocket main
        working-directory: pocket-source
        env:
          SOURCE_SHA: ${{ steps.inputs.outputs.sha }}
        run: |
          if [[ "$(git rev-parse --verify HEAD 2>/dev/null)" != "$SOURCE_SHA" ]] ||
             ! git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main >/dev/null 2>&1; then
            echo "::error::Source SHA must match checkout HEAD and belong to PocketFlutter/Pocket main"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Verify registry conformance and installer tests
        working-directory: pocket-source
        run: |
          (
            cd sdk
            npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund >/dev/null 2>&1
          )
          bun sdk/scripts/check_registry_conformance.ts
          bun test sdk/scripts/tests/package_registry.test.ts sdk/scripts/tests/package_installer_safety.test.ts

      - name: Build and verify Ed25519-signed package registry
        working-directory: pocket-source
        env:
          POCKET_REGISTRY_SIGNING_KEY: ${{ secrets.POCKET_REGISTRY_SIGNING_KEY }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/registry-key.json"
          (
            umask 077
            printf '%s' "$POCKET_REGISTRY_SIGNING_KEY" > "$KEY_FILE"
          )
          OUT_DIR="$GITHUB_WORKSPACE/pages-dist"
          bun sdk/pocket.ts registry build \
            --out="$OUT_DIR" \
            --key-file="$KEY_FILE" \
            --github-base-url="https://pocketflutter.github.io/pocket-releases"
          rm -f "$KEY_FILE"

          bun --input-type=module - "$OUT_DIR" <<'JS'
          import { createHash, createPublicKey, verify as cryptoVerify } from "node:crypto";
          import { existsSync, readFileSync, statSync } from "node:fs";
          import { join } from "node:path";
          import { OFFICIAL_PACKAGE_SPECS, POCKET_OFFICIAL_REGISTRY_PUBLIC_KEY_PEM } from "./sdk/scripts/registry_catalog.ts";

          const outDir = process.argv[2];
          const signed = JSON.parse(readFileSync(join(outDir, "registry/v1/signed-index.json"), "utf8"));
          const payloadBytes = Buffer.from(signed.payload, "base64");
          const pubKey = createPublicKey(POCKET_OFFICIAL_REGISTRY_PUBLIC_KEY_PEM);
          const valid = cryptoVerify(null, payloadBytes, pubKey, Buffer.from(signed.signature, "base64"));
          if (!valid) throw new Error("Ed25519 signature verification failed against committed public key");

          const doc = JSON.parse(payloadBytes.toString("utf8"));
          const expected = new Set(OFFICIAL_PACKAGE_SPECS.map((spec) => spec.slug));
          if (!Array.isArray(doc.packages) || doc.totalPackages !== expected.size || doc.packages.length !== expected.size) {
            throw new Error(`Expected ${expected.size} packages, got ${doc.totalPackages}`);
          }
          for (const pkg of doc.packages) {
            if (!expected.delete(pkg.slug)) throw new Error(`Unexpected or duplicate package: ${pkg.slug}`);
          }
          for (const pkg of doc.packages) {
            const tgzPath = join(outDir, pkg.tarballPath);
            if (!existsSync(tgzPath)) throw new Error(`Missing tarball: ${pkg.tarballPath}`);
            const stat = statSync(tgzPath);
            if (stat.size !== pkg.tarballSize) throw new Error(`Size mismatch for ${pkg.slug}`);
            const sha = createHash("sha256").update(readFileSync(tgzPath)).digest("hex");
            if (sha !== pkg.tarballSha256) throw new Error(`SHA-256 mismatch for ${pkg.slug}`);
          }
          console.log(`Verified Ed25519 signed index and all ${doc.totalPackages} tarballs (SDK v${doc.sdkVersion}).`);
          JS

          cat > "$OUT_DIR/index.html" <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>PocketFlutter Official Package Registry</title>
          </head>
          <body>
            <h1>PocketFlutter Official Package Registry</h1>
            <ul>
              <li><a href="./registry/v1/signed-index.json">registry/v1/signed-index.json</a></li>
              <li><a href="./registry/v1/index.json">registry/v1/index.json</a></li>
              <li><a href="./registry/v1/public-key.pem">registry/v1/public-key.pem</a></li>
            </ul>
          </body>
          </html>
          HTML

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

      - name: Remove private source checkout and signing key
        if: always()
        run: rm -rf pocket-source "$RUNNER_TEMP/registry-key.json"

  deploy:
    name: Deploy Registry to GitHub Pages
    needs: build-registry
    if: inputs.deploy_pages
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live signed-index.json endpoint
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${PAGE_URL%/}"
          url="$base/registry/v1/signed-index.json"
          for attempt in 1 2 3 4 5 6; do
            if body="$(curl -fsSL "$url" 2>/dev/null)"; then
              printf '%s' "$body" | node -e '
                let data = "";
                process.stdin.on("data", c => data += c);
                process.stdin.on("end", () => {
                  const doc = JSON.parse(data);
                  if (doc.kind !== "pocket-signed-package-registry-index") {
                    throw new Error(`Unexpected kind: ${doc.kind}`);
                  }
                  console.log(`Live verified: ${doc.keyId}`);
                });
              '
              exit 0
            fi
            sleep 5
          done
          echo "::error::Failed to verify $url after deployment"
          exit 1

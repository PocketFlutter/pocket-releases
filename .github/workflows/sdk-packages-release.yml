name: Pocket SDK Packages Release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact PocketFlutter/Pocket commit on main
        required: true
        type: string
      mode:
        description: Release mode (dry-run or publish)
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
      repository_url:
        description: Optional repository.url for GitHub Packages manifests
        required: false
        default: https://github.com/PocketFlutter/pocket-releases.git
        type: string
      target:
        description: Package selection
        required: true
        default: all
        type: choice
        options:
          - all
          - open-sdk

permissions:
  contents: read
  packages: write

concurrency:
  group: pocket-sdk-packages-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sdk-packages:
    name: SDK Packages (${{ inputs.target }}, ${{ inputs.mode }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: pocket-source-ci
    steps:
      - name: Validate source commit input
        id: inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_KEY_AVAILABLE: ${{ secrets.POCKET_SOURCE_SSH_KEY != '' }}
        run: |
          [[ "$SOURCE_KEY_AVAILABLE" == true ]] || { echo "::error::Missing POCKET_SOURCE_SSH_KEY"; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] ||
            { echo "::error::Expected a full 40-character source SHA"; exit 1; }
          printf 'sha=%s\n' "${SOURCE_SHA,,}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: PocketFlutter/Pocket
          ref: ${{ steps.inputs.outputs.sha }}
          path: pocket-source
          ssh-key: ${{ secrets.POCKET_SOURCE_SSH_KEY }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify ancestry on PocketFlutter/Pocket main
        working-directory: pocket-source
        env:
          SOURCE_SHA: ${{ steps.inputs.outputs.sha }}
        run: |
          if [[ "$(git rev-parse --verify HEAD 2>/dev/null)" != "$SOURCE_SHA" ]] ||
             ! git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main >/dev/null 2>&1; then
            echo "::error::Source SHA must match checkout HEAD and belong to PocketFlutter/Pocket main"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@pocketflutter"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Run host package regression tests
        if: inputs.target == 'all'
        working-directory: pocket-source
        run: |
          bun test sdk/scripts/tests/release_sdk_packages.test.ts \
            sdk/packages/pocket_diagnostics/test sdk/packages/pocket_cos/test \
            sdk/packages/pocket_cloudflare/test \
            sdk/packages/pocket_vn/test/engine.test.ts \
            sdk/packages/pocket_live2d/test/live2d.test.ts sdk/packages/pocket_live2d/test/interaction.test.ts

      - name: Run release_sdk_packages (${{ inputs.mode }})
        if: inputs.target == 'all'
        working-directory: pocket-source
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POCKET_GITHUB_PACKAGES_REPO_URL: ${{ inputs.repository_url }}
          MODE: ${{ inputs.mode }}
        run: |
          if [[ "$MODE" == "publish" ]]; then
            node sdk/scripts/release_sdk_packages.mjs --publish
          else
            node sdk/scripts/release_sdk_packages.mjs
          fi

      - name: Release Open SDK package only
        if: inputs.target == 'open-sdk'
        working-directory: pocket-source
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          registry=https://npm.pkg.github.com
          repository_url=https://github.com/PocketFlutter/pocket-releases.git
          node sdk/scripts/package_github_packages.mjs --out "$scratch/staged" --repository-url "$repository_url" > "$scratch/catalog.json"
          manifest="$scratch/staged/open-sdk/package.json"
          package="$(jq -er 'select(.name == "@pocketflutter/open-sdk") | .name + "@" + .version' "$manifest")"
          ui="$(jq -er '.dependencies["@pocket/ui"] | select(test("^npm:@pocketflutter/ui@[0-9]+[.][0-9]+[.][0-9]+$"))' "$manifest")"
          ui_version="${ui##*@}"
          workspace_ui="$(jq -er '.dependencies["@pocket/ui"]' sdk/packages/pocket_open_sdk/package.json)"
          if [[ "$ui_version" != "$workspace_ui" ]]; then
            echo "::error::Staged UI alias $ui differs from the pinned Open SDK workspace dependency $workspace_ui"
            exit 1
          fi
          npm view "${ui#npm:}" version --registry "$registry" --prefer-online --json |
            jq -e --arg version "$ui_version" '. == $version' > /dev/null

          cd "$scratch"
          npm pack ./staged/open-sdk --registry "$registry" --ignore-scripts --json > pack.json
          archive="$(jq -er '.[0].filename' pack.json)"
          status=pending
          mkdir remote
          if npm pack "$package" --registry "$registry" --ignore-scripts --prefer-online --pack-destination "$PWD/remote" --json > remote.json 2> remote.err; then
            remote_archive="$(jq -er '.[0].filename' remote.json)"
            gzip -dc "$archive" > local.tar
            gzip -dc "remote/$remote_archive" > remote.tar
            if ! cmp -s local.tar remote.tar; then
              echo "::error::$package is already published with different contents"
              exit 1
            fi
            status=published
          elif ! jq -e '.error.code == "E404" or .error.code == "ETARGET"' remote.json > /dev/null 2>&1 &&
               ! rg -q '^npm (error|ERR!) code (E404|ETARGET)$' remote.err; then
            cat remote.err >&2
            exit 1
          fi

          verify_consumer() {
            local directory="$1"
            local dependency="$2"
            mkdir "$directory"
            jq -n --arg dependency "$dependency" '{
              name: "pocket-open-sdk-consumer",
              private: true,
              dependencies: {"@pocket/open-sdk": $dependency}
            }' > "$directory/package.json"
            (
              cd "$directory"
              npm install --ignore-scripts --no-audit --prefer-online
              OPEN_SDK_VERSION="${package##*@}" UI_VERSION="$ui_version" bun - <<'BUN'
          import { strictEqual } from "node:assert";
          import { readFileSync, realpathSync } from "node:fs";
          import { join } from "node:path";

          const consumer = realpathSync(process.cwd());
          const openSdk = join(consumer, "node_modules/@pocket/open-sdk");
          const ui = join(consumer, "node_modules/@pocket/ui");
          const manifest = (directory) => JSON.parse(readFileSync(join(directory, "package.json"), "utf8"));
          strictEqual(realpathSync(openSdk), openSdk);
          strictEqual(realpathSync(ui), ui);
          strictEqual(manifest(openSdk).name, "@pocketflutter/open-sdk");
          strictEqual(manifest(openSdk).version, process.env.OPEN_SDK_VERSION);
          strictEqual(manifest(openSdk).dependencies["@pocket/ui"], `npm:@pocketflutter/ui@${process.env.UI_VERSION}`);
          strictEqual(manifest(ui).name, "@pocketflutter/ui");
          strictEqual(manifest(ui).version, process.env.UI_VERSION);
          strictEqual(Bun.resolveSync("@pocket/open-sdk", consumer), join(openSdk, "src/index.ts"));
          strictEqual(Bun.resolveSync("@pocket/ui/platform", join(openSdk, "src")), join(ui, "src/platform.ts"));
          console.log("Verified Open SDK and UI registry aliases and Bun export resolution");
          BUN
            )
          }

          verify_consumer staged-consumer "file:$scratch/$archive"
          if [[ "$MODE" == publish ]]; then
            if [[ "$status" == pending ]]; then
              npm publish "./$archive" --registry "$registry" --ignore-scripts
              status=published
            fi
            verify_consumer registry-consumer "npm:$package"
          fi
          printf 'Open SDK package `%s` is **%s**. Verified UI dependency `%s`.\n' "$package" "$status" "$ui" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove private source checkout
        if: always()
        run: rm -rf pocket-source
